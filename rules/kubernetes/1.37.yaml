version: "1.37"

removedAPIs:
  - id: "UPG-1.37-WORKLOAD-V1ALPHA2"
    groupVersion: "scheduling.k8s.io/v1alpha2"
    kind: "Workload"
    removedIn: "1.37"
    matchPresence: true
    message: "The scheduling.k8s.io/v1alpha2 Workload API is not served by Kubernetes 1.37."
    recommendation: "Migrate Workload manifests and clients to scheduling.k8s.io/v1beta1, and remove all persisted v1alpha2 objects before upgrading."
    documentationURL: "https://github.com/kubernetes/kubernetes/blob/v1.37.1/CHANGELOG/CHANGELOG-1.37.md#urgent-upgrade-notes"
  - id: "UPG-1.37-PODGROUP-V1ALPHA2"
    groupVersion: "scheduling.k8s.io/v1alpha2"
    kind: "PodGroup"
    removedIn: "1.37"
    matchPresence: true
    message: "The scheduling.k8s.io/v1alpha2 PodGroup API is not served by Kubernetes 1.37."
    recommendation: "Migrate PodGroup manifests and clients to scheduling.k8s.io/v1beta1, and remove all persisted v1alpha2 objects before upgrading."
    documentationURL: "https://github.com/kubernetes/kubernetes/blob/v1.37.1/CHANGELOG/CHANGELOG-1.37.md#urgent-upgrade-notes"
  - id: "UPG-1.37-KUBEADM-INIT-V1BETA3"
    groupVersion: "kubeadm.k8s.io/v1beta3"
    kind: "InitConfiguration"
    removedIn: "1.37"
    sourceOnly: true
    message: "kubeadm.k8s.io/v1beta3 InitConfiguration is not supported by kubeadm 1.37."
    recommendation: "Use kubeadm 1.35 'config migrate' to convert this configuration to kubeadm.k8s.io/v1beta4 before upgrading."
    documentationURL: "https://github.com/kubernetes/kubernetes/blob/v1.37.1/CHANGELOG/CHANGELOG-1.37.md#other-cleanup-or-flake"
  - id: "UPG-1.37-KUBEADM-CLUSTER-V1BETA3"
    groupVersion: "kubeadm.k8s.io/v1beta3"
    kind: "ClusterConfiguration"
    removedIn: "1.37"
    sourceOnly: true
    message: "kubeadm.k8s.io/v1beta3 ClusterConfiguration is not supported by kubeadm 1.37."
    recommendation: "Use kubeadm 1.35 'config migrate' to convert this configuration to kubeadm.k8s.io/v1beta4 before upgrading."
    documentationURL: "https://github.com/kubernetes/kubernetes/blob/v1.37.1/CHANGELOG/CHANGELOG-1.37.md#other-cleanup-or-flake"
  - id: "UPG-1.37-KUBEADM-JOIN-V1BETA3"
    groupVersion: "kubeadm.k8s.io/v1beta3"
    kind: "JoinConfiguration"
    removedIn: "1.37"
    sourceOnly: true
    message: "kubeadm.k8s.io/v1beta3 JoinConfiguration is not supported by kubeadm 1.37."
    recommendation: "Use kubeadm 1.35 'config migrate' to convert this configuration to kubeadm.k8s.io/v1beta4 before upgrading."
    documentationURL: "https://github.com/kubernetes/kubernetes/blob/v1.37.1/CHANGELOG/CHANGELOG-1.37.md#other-cleanup-or-flake"

deprecatedAPIs:
  - id: "UPG-1.37-CLUSTERTRUSTBUNDLE-V1BETA1"
    groupVersion: "certificates.k8s.io/v1beta1"
    kind: "ClusterTrustBundle"
    message: "ClusterTrustBundle certificates.k8s.io/v1beta1 is deprecated in Kubernetes 1.37."
    recommendation: "Migrate ClusterTrustBundle manifests and clients to certificates.k8s.io/v1."
    documentationURL: "https://github.com/kubernetes/kubernetes/blob/v1.37.1/staging/src/k8s.io/api/certificates/v1beta1/types.go"
  - id: "UPG-1.37-PODCERTIFICATEREQUEST-V1BETA1"
    groupVersion: "certificates.k8s.io/v1beta1"
    kind: "PodCertificateRequest"
    message: "PodCertificateRequest certificates.k8s.io/v1beta1 is deprecated in Kubernetes 1.37."
    recommendation: "Migrate PodCertificateRequest clients to certificates.k8s.io/v1. The v1 API removes the deprecated PKIXPublicKey and ProofOfPossession fields."
    documentationURL: "https://github.com/kubernetes/kubernetes/blob/v1.37.1/staging/src/k8s.io/api/certificates/v1beta1/types.go"
  - id: "UPG-1.37-STORAGEMIGRATION-V1BETA1"
    groupVersion: "storagemigration.k8s.io/v1beta1"
    kind: "StorageVersionMigration"
    message: "StorageVersionMigration storagemigration.k8s.io/v1beta1 is deprecated in Kubernetes 1.37."
    recommendation: "Migrate StorageVersionMigration manifests and clients to storagemigration.k8s.io/v1."
    documentationURL: "https://github.com/kubernetes/kubernetes/blob/v1.37.1/staging/src/k8s.io/api/storagemigration/v1beta1/types.go"

resourceChecks:
  - id: "UPG-1.37-KUBELET-EVENTRECORDQPS-ZERO"
    name: "kubeletEventRecordQPSZero"
    severity: "high"
    message: "Kubernetes 1.37 treats kubelet eventRecordQPS: 0 as unlimited instead of applying the historical default rate limit."
    recommendation: "Set eventRecordQPS to an explicit non-zero value such as 50 if the previous effective rate limit must be preserved."
    documentationURL: "https://github.com/kubernetes/kubernetes/blob/v1.37.1/CHANGELOG/CHANGELOG-1.37.md#urgent-upgrade-notes"
  - id: "UPG-1.37-SELINUX-VOLUME-CONFLICT"
    name: "selinuxVolumeConflict"
    severity: "high"
    message: "The Kubernetes SELinux warning controller reported a volume-label or change-policy conflict that can prevent a Pod from starting after SELinuxMount becomes enabled by default in 1.37."
    recommendation: "Remove the conflicting volume sharing pattern or set spec.securityContext.seLinuxChangePolicy to Recursive on the affected workload before upgrading."
    documentationURL: "https://kubernetes.io/blog/2026/04/22/breaking-changes-in-selinux-volume-labeling/"
  - id: "UPG-1.37-KUBEPROXY-IPVS"
    name: "kubeProxyIPVS"
    severity: "medium"
    message: "kube-proxy IPVS mode is deprecated and Kubernetes 1.37 emits a startup warning for it."
    recommendation: "Migrate KubeProxyConfiguration mode to nftables on supported kernels, or to iptables where nftables is unavailable."
    documentationURL: "https://kubernetes.io/blog/2026/08/26/kubernetes-v1-37-release/#deprecating-kube-proxy-s-support-for-ipvs-mode"
  - id: "UPG-1.37-KUBEPROXY-MODE-UNSET"
    name: "kubeProxyModeUnset"
    severity: "low"
    message: "Kubernetes 1.37 warns when KubeProxyConfiguration mode is empty because the default is planned to change in a future release."
    recommendation: "Set mode explicitly to nftables on supported kernels or iptables where nftables is unavailable."
    documentationURL: "https://github.com/kubernetes/kubernetes/blob/v1.37.1/CHANGELOG/CHANGELOG-1.37.md#deprecation"
  - id: "UPG-1.37-KUBEDNS"
    name: "kubeDNS"
    severity: "medium"
    message: "kube-dns is deprecated in Kubernetes 1.37 and is expected to stop receiving packages after 1.40."
    recommendation: "Migrate the cluster DNS add-on from kube-dns to CoreDNS."
    documentationURL: "https://kubernetes.io/blog/2026/08/26/kubernetes-v1-37-release/#deprecation-of-kube-dns"
  - id: "UPG-1.37-NODE-LOGS-RBAC"
    name: "nodeLogsRBAC"
    severity: "info"
    message: "A ClusterRole grants access to nodes/logs; Kubernetes 1.37 kubelet startup logs include the effective configuration and may expose sensitive operational details."
    recommendation: "Confirm every subject bound to this ClusterRole is trusted to read node configuration details, and remove unnecessary nodes/logs access before upgrading."
    documentationURL: "https://github.com/kubernetes/kubernetes/blob/v1.37.1/CHANGELOG/CHANGELOG-1.37.md#urgent-upgrade-notes"
  - id: "UPG-1.37-STATIC-POD-API-REFERENCE"
    name: "staticPodAPIReference"
    severity: "critical"
    message: "This static Pod references a Kubernetes API object; Kubernetes 1.37 always rejects static Pod manifests with API references."
    recommendation: "Remove ServiceAccount, Secret, ConfigMap, PVC, CSI, ResourceClaim, and other API-object references from the static Pod, or run it through the API server as a regular workload."
    documentationURL: "https://kubernetes.io/blog/2026/08/26/kubernetes-v1-37-release/#kubelet-static-pods-can-no-longer-reference-secrets-or-configmaps"
  - id: "UPG-1.37-CGROUP-V1-OVERRIDE"
    name: "kubeletCgroupV1Override"
    severity: "info"
    message: "KubeletConfiguration explicitly allows cgroup v1, whose Kubernetes support is being phased out."
    recommendation: "Migrate nodes and the container runtime to cgroup v2, then remove the failCgroupV1: false compatibility override."
    documentationURL: "https://kubernetes.io/blog/2026/08/26/kubernetes-v1-37-release/#ongoing-major-change-future-removal-of-cgroup-v1-support"
  - id: "UPG-1.37-CLOUD-NODE-MONITOR-PERIOD"
    name: "cloudNodeMonitorPeriod"
    severity: "high"
    message: "CloudControllerManagerConfiguration uses the Kubernetes 1.36 kubeCloudShared.nodeMonitorPeriod field, which moved in 1.37."
    recommendation: "Move kubeCloudShared.nodeMonitorPeriod to nodeLifecycleController.nodeMonitorPeriod before starting the Kubernetes 1.37 cloud-controller-manager."
    documentationURL: "https://github.com/kubernetes/kubernetes/pull/137964"
  - id: "UPG-1.37-LOCKED-FEATURE-GATE"
    name: "lockedFeatureGate"
    severity: "critical"
    message: "A component sets a feature gate contrary to the value that Kubernetes 1.37 locks as its default."
    recommendation: "Remove the override or use the Kubernetes 1.37 locked default: DeclarativeValidationTakeover=false, DRAPrioritizedList=true, and HostnameOverride=true."
    documentationURL: "https://github.com/kubernetes/kubernetes/blob/v1.37.1/CHANGELOG/CHANGELOG-1.37.md#deprecation"
  - id: "UPG-1.37-REMOVED-FEATURE-GATE"
    name: "removedFeatureGate"
    severity: "critical"
    message: "A component configuration explicitly sets a feature gate removed in Kubernetes 1.37."
    recommendation: "Remove the obsolete feature-gate setting before upgrading; use GenericWorkload instead of GangScheduling or WorkloadAwarePreemption where applicable."
    documentationURL: "https://github.com/kubernetes/kubernetes/blob/v1.37.1/CHANGELOG/CHANGELOG-1.37.md#other-cleanup-or-flake"
  - id: "UPG-1.37-REMOVED-COMPONENT-FLAG"
    name: "removedComponentFlag"
    severity: "critical"
    message: "A Kubernetes component is configured with a command-line flag removed in Kubernetes 1.37."
    recommendation: "Remove the obsolete component flag before upgrading; kubelet will fail to start when a removed cAdvisor flag is present."
    documentationURL: "https://github.com/kubernetes/kubernetes/blob/v1.37.1/CHANGELOG/CHANGELOG-1.37.md#dependency"
