apiVersion: v1
kind: Namespace
metadata:
  name: kubeimpact-demo
  labels:
    app.kubernetes.io/part-of: kubeimpact-demo
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubeimpact
  namespace: kubeimpact-demo
  labels:
    app.kubernetes.io/part-of: kubeimpact-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubeimpact-demo
  labels:
    app.kubernetes.io/part-of: kubeimpact-demo
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["services", "namespaces", "events", "pods"]
    verbs: ["list"]
  - apiGroups: ["storagemigration.k8s.io"]
    resources: ["storageversionmigrations"]
    verbs: ["list"]
  - apiGroups: ["scheduling.k8s.io"]
    resources: ["workloads", "podgroups"]
    verbs: ["list"]
  - apiGroups: ["certificates.k8s.io"]
    resources: ["clustertrustbundles", "podcertificaterequests"]
    verbs: ["list"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    verbs: ["list"]
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubeimpact-demo
  labels:
    app.kubernetes.io/part-of: kubeimpact-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubeimpact-demo
subjects:
  - kind: ServiceAccount
    name: kubeimpact
    namespace: kubeimpact-demo
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kubeimpact-data
  namespace: kubeimpact-demo
  labels:
    app.kubernetes.io/part-of: kubeimpact-demo
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubeimpact
  namespace: kubeimpact-demo
  labels:
    app.kubernetes.io/name: kubeimpact
    app.kubernetes.io/part-of: kubeimpact-demo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: kubeimpact
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubeimpact
        app.kubernetes.io/part-of: kubeimpact-demo
      annotations:
        kubeimpact.io/ignore: WLK-SA-TOKEN-001
        kubeimpact.io/ignore-reason: The demo scanner needs its read-only Kubernetes API credentials.
    spec:
      serviceAccountName: kubeimpact
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kubeimpact
          image: kubeimpact:demo
          imagePullPolicy: Never
          env:
            - name: KUBEIMPACT_DB_PATH
              value: /data/kubeimpact.db
            - name: KUBEIMPACT_SCAN_TIMEOUT
              value: 2m
            - name: KUBEIMPACT_SOURCE_ROOT
              value: /sources
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: data
              mountPath: /data
            - name: sources
              mountPath: /sources
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: kubeimpact-data
        - name: sources
          configMap:
            name: kubeimpact-upgrade-source
            defaultMode: 0444
            items:
              - key: manifests.yaml
                path: upgrade/manifests.yaml
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: kubeimpact
  namespace: kubeimpact-demo
  labels:
    app.kubernetes.io/name: kubeimpact
    app.kubernetes.io/part-of: kubeimpact-demo
spec:
  selector:
    app.kubernetes.io/name: kubeimpact
  ports:
    - name: http
      port: 80
      targetPort: http
